<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Error de Inicio - MapleVault</title>
  <style>
    body {
      background-color: #0D0F14;
      color: #F1F3F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .warning-icon {
      font-size: 32px;
      margin-right: 12px;
      color: #EF4444;
    }
    .title {
      font-size: 16px;
      font-weight: 850;
      color: #F1F3F5;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 11px;
      color: #6F7785;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .content {
      flex: 1;
      background-color: #141821;
      border: 1px solid #2A3140;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      overflow-y: auto;
    }
    .error-title {
      font-size: 12px;
      font-weight: 700;
      color: #EF4444;
      margin-bottom: 6px;
    }
    .error-details {
      font-size: 11px;
      color: #A8B0BD;
      line-height: 1.6;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    button {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-primary {
      background-color: #8B5CF6;
      color: white;
    }
    .btn-primary:hover {
      background-color: #7C3AED;
    }
    .btn-secondary {
      background-color: #1E2430;
      color: #A8B0BD;
      border-color: #2A3140;
    }
    .btn-secondary:hover {
      background-color: #2D3748;
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="warning-icon">!</div>
    <div>
      <div class="title">No se pudo iniciar MapleVault Local</div>
      <div class="subtitle">Diagnóstico del sistema</div>
    </div>
  </div>

  <div class="content">
    <div class="error-title">Detalle del Error:</div>
    <div class="error-details" id="details-text">Verificando componentes...</div>
  </div>

  <div class="actions">
    <button id="open-logs" class="btn-secondary">Abrir logs</button>
    <button id="exit" class="btn-secondary">Cerrar</button>
    <button id="retry" class="btn-primary">Reintentar</button>
  </div>

  <script src="./error-renderer.js"></script>
</body>
</html>
