<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Cargando MapleVault</title>
  <style>
    body {
      background-color: #0D0F14;
      color: #F1F3F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }
    .container {
      text-align: center;
      width: 320px;
    }
    .mascot {
      display: block;
      width: 138px;
      height: 138px;
      object-fit: contain;
      margin: 0 auto 12px;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.38));
      animation: enter 280ms ease-out both;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
      color: #F4F6F8;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 10px;
      font-weight: 600;
      color: #747E8D;
      letter-spacing: 0;
      margin-bottom: 22px;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid #252B36;
      border-top-color: #D95858;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex: 0 0 auto;
    }
    .status {
      font-size: 11px;
      color: #A8B0BD;
      font-weight: 500;
      letter-spacing: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="mascot" src="./assets/splash-mascot.png" alt="Mascota de MapleVault">
    <div class="logo">MapleVault</div>
    <div class="subtitle">Biblioteca local de anime</div>
    <div class="loading">
      <div class="spinner"></div>
      <div class="status" id="status-text">Iniciando base de datos...</div>
    </div>
  </div>
  <script src="./splash-renderer.js"></script>
</body>
</html>
