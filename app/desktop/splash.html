<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Cargando MapleVault</title>
  <style>
    body {
      background-color: #0D0F14;
      color: #F1F3F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }
    .container {
      text-align: center;
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 2px;
      background: linear-gradient(135deg, #8B5CF6 0%, #38BDF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 700;
      color: #6F7785;
      letter-spacing: 3px;
      margin-bottom: 30px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid #1E2430;
      border-top-color: #8B5CF6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    .status {
      font-size: 11px;
      color: #A8B0BD;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">MapleVault</div>
    <div class="subtitle"></div>
    <div class="spinner"></div>
    <div class="status" id="status-text">Iniciando base de datos...</div>
  </div>
  <script src="./splash-renderer.js"></script>
</body>
</html>
