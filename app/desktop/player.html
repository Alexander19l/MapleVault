<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; frame-src http: https:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapleVault Player</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
        color: #cbd5e1;
        font-family: "Segoe UI", sans-serif;
      }

      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
        visibility: hidden;
      }

      .loader {
        width: 32px;
        height: 32px;
        border: 3px solid #334155;
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .error {
        display: none;
        padding: 24px;
        text-align: center;
        font-size: 14px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loader" class="loader" aria-label="Cargando reproductor"></div>
    <div id="error" class="error">No se pudo abrir el reproductor.</div>
    <!-- allowfullscreen (atributo antiguo) ademas de allow="fullscreen": algunos
         reproductores como Voe siguen comprobando el atributo y sin el su boton de
         pantalla completa no hace nada. -->
    <iframe
      id="player"
      title="Reproductor de video"
      allowfullscreen
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    ></iframe>
    <script src="./player-renderer.js"></script>
  </body>
</html>
